server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: kb-document

  # Nacos service registration and discovery
  cloud:
    nacos:
      config:
        namespace: knowledge
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yaml
        group: KNOWLEDGE_BASE
        enabled: true
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: knowledge
        group: ${COMPUTER_ID:${USER:default}}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        ip: 127.0.0.1
  config:
    import: optional:nacos:kb-document-dev.yaml

  # Data source configuration
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kb_document?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:123456}
    druid:
      initial-size: 20
      min-idle: 10
      max-active: 100
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
        login-username: ${DRUID_STAT_USERNAME:admin}
        login-password: ${DRUID_STAT_PASSWORD:admin}



  # Servlet configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
      # Files larger than 2MB are written to a temp directory on disk to avoid OOM
      file-size-threshold: 2MB
      location: ${java.io.tmpdir}/kb-document-multipart

  # Jackson configuration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # Elasticsearch configuration
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 10s
    socket-timeout: 30s

  data:
    # Redis configuration
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 2
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 20
          max-wait: 3000ms
          max-idle: 10
          min-idle: 5
          time-between-eviction-runs: 30s
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: 27017
      auto-index-creation: true
      database: knowledge_base
      username: ${MONGODB_USERNAME:mongodb}
      password: ${MONGODB_PASSWORD:}
  cache:
    type: redis
    redis:
      time-to-live: 1800000

  # RabbitMQ configuration (publishes statistics events)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

# MyBatis Plus configuration
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.knowledge.base.document.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: input
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Logging configuration
logging:
  level:
    root: INFO
    com.knowledge.base: DEBUG
    com.baomidou.mybatisplus: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# File storage configuration
file:
  upload:
    path: ./uploads
    allowed-types:
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - ppt
      - pptx
      - txt
      - md
    max-size: 20971520
  # rustfs file server configuration
  server:
    rustfs:
      enabled: false
      base-url: http://localhost:8080
      upload-path: /api/upload
      access-prefix: /files
      auth-token:
      connect-timeout: 5000
      read-timeout: 30000
      max-file-size: 20971520

# kb-file service direct address (used for local development; leave blank to use Nacos service discovery)
kb-file:
  url: http://localhost:8084

# kb-ai service direct address (used for local development)
kb-ai:
  url: http://localhost:8086

# kb-user-auth service direct address (used to fetch user avatar and other info)
kb-user-auth:
  url: http://localhost:8081

# JWT security configuration
security:
  jwt:
    exclude-paths: >
      /document/public/**,
      /public/**,
      /actuator/**,
      /doc.html,
      /swagger-resources/**,
      /v3/api-docs/**,
      /webjars/**,
      /favicon.ico

# Swagger configuration
knife4j:
  enable: true
  setting:
    language: zh_cn
  production: false

# Feign configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 30000
        loggerLevel: basic
      kb-file:
        connectTimeout: 10000
        readTimeout: 600000
        loggerLevel: basic
  circuitbreaker:
    enabled: false
