<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Debug Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .section {
            margin: 20px 0;
            padding: 20px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h3 {
            color: #333;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
        }
        button:hover {
            background: #45a049;
        }
        button.danger {
            background: #f44336;
        }
        button.danger:hover {
            background: #da190b;
        }
        pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 12px;
            line-height: 1.5;
            max-height: 400px;
            overflow-y: auto;
        }
        .success { color: #4CAF50; font-weight: bold; }
        .error { color: #f44336; font-weight: bold; }
        .warning { color: #ff9800; font-weight: bold; }
        .info { color: #2196F3; font-weight: bold; }
        input {
            padding: 8px;
            margin: 5px;
            width: 400px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🔧 JWT Token Debug Test</h1>
    <p>Used to test JWT Token generation and parsing functionality</p>

    <!-- Test 1: generate a Token -->
    <div class="section">
        <h3>Test 1: Generate Token</h3>
        <div class="row">
            <label>User ID:</label>
            <input type="number" id="userId" value="1" placeholder="Enter a user ID">
            <button onclick="testGenerate()">Generate Token</button>
        </div>
        <pre id="generateResult">Waiting for action...</pre>
    </div>

    <!-- Test 2: parse a Token -->
    <div class="section">
        <h3>Test 2: Parse Token</h3>
        <div class="row">
            <label>Token:</label>
            <input type="text" id="tokenInput" placeholder="Paste a JWT Token" style="width: 600px;">
            <button onclick="testParse()">Parse</button>
        </div>
        <pre id="parseResult">Waiting for action...</pre>
    </div>

    <!-- Test 3: full flow test -->
    <div class="section">
        <h3>Test 3: Full Flow Test</h3>
        <div class="row">
            <label>User ID:</label>
            <input type="number" id="testUserId" value="1" placeholder="Enter a user ID">
            <button onclick="testCompleteFlow()">Run Full Test</button>
        </div>
        <pre id="flowResult">Waiting for action...</pre>
    </div>

    <!-- Test 4: validate a user-supplied Token -->
    <div class="section">
        <h3>Test 4: Validate a User-Supplied Token</h3>
        <button onclick="testUserToken()">Validate User Token</button>
        <pre id="userTokenResult">Waiting for action...</pre>
    </div>

    <script>
        const API_BASE = '/api';

        // The user-supplied token
        const USER_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJ0eXBlIjoiYWNjZXNzIiwidXNlcklkIjoxMDAwMDAwMDAwMDAwMDAwMDAxLCJzdWIiOiIxMDAwMDAwMDAwMDAwMDAwMDAxIiwiaXNzIjoia25vd2xlZGdlLWJhc2UiLCJpYXQiOjE3NzkwNzA0MTQsImV4cCI6MTc4NjI3MDQxNH0.GyUfhRY9Y_B9JICqJ0OvEB3Esv5XY07oah0XYYWukQk';

        // Test 1: generate a Token
        async function testGenerate() {
            const userId = document.getElementById('userId').value;
            const resultEl = document.getElementById('generateResult');

            try {
                resultEl.innerHTML = '<span class="info">⏳ Generating Token...</span>';

                const response = await fetch(`${API_BASE}/auth/debug/generate?userId=${userId}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });

                const data = await response.json();

                resultEl.innerHTML = `<span class="info">📤 Generation response:</span>
${JSON.stringify(data, null, 2)}`;

                if (data.accessToken) {
                    resultEl.innerHTML += `

<span class="success">✅ Token generated successfully!</span>
<span class="info">accessToken length:</span> ${data.accessToken.length}
<span class="info">refreshToken length:</span> ${data.refreshToken.length}

<span class="info">📝 Auto-filling into the parse test...</span>`;
                    document.getElementById('tokenInput').value = data.accessToken;
                }
            } catch (error) {
                resultEl.innerHTML = `<span class="error">❌ Request failed: ${error.message}</span>`;
            }
        }

        // Test 2: parse a Token
        async function testParse() {
            const token = document.getElementById('tokenInput').value;
            const resultEl = document.getElementById('parseResult');

            if (!token) {
                resultEl.innerHTML = '<span class="error">❌ Please enter a Token</span>';
                return;
            }

            try {
                resultEl.innerHTML = '<span class="info">⏳ Parsing Token...</span>';

                const response = await fetch(`${API_BASE}/auth/debug/parse`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `token=${encodeURIComponent(token)}`,
                });

                const data = await response.json();

                resultEl.innerHTML = `<span class="info">📤 Parse response:</span>
${JSON.stringify(data, null, 2)}`;

                if (data.valid || data.claims) {
                    resultEl.innerHTML += `

<span class="success">✅ Token parsed successfully!</span>
<span class="info">User ID:</span> ${data.userId || data.claims?.subject}`;
                } else {
                    resultEl.innerHTML += `

<span class="error">❌ Token parsing failed</span>
<span class="error">Error:</span> ${data.error || 'Unknown error'}`;
                }
            } catch (error) {
                resultEl.innerHTML = `<span class="error">❌ Request failed: ${error.message}</span>`;
            }
        }

        // Test 3: full flow test
        async function testCompleteFlow() {
            const userId = document.getElementById('testUserId').value;
            const resultEl = document.getElementById('flowResult');

            try {
                resultEl.innerHTML = '<span class="info">⏳ Testing the full flow...</span>';

                const response = await fetch(`${API_BASE}/auth/debug/test?userId=${userId}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });

                const data = await response.json();

                resultEl.innerHTML = `<span class="info">📤 Test result:</span>
${JSON.stringify(data, null, 2)}`;

                if (data.step1_generate && result.step2_validate && result.step3_parse) {
                    resultEl.innerHTML += `

<span class="success">✅ Full flow test succeeded!</span>`;
                }
            } catch (error) {
                resultEl.innerHTML = `<span class="error">❌ Request failed: ${error.message}</span>`;
            }
        }

        // Test 4: validate a user-supplied Token
        async function testUserToken() {
            const resultEl = document.getElementById('userTokenResult');

            try {
                resultEl.innerHTML = '<span class="info">⏳ Validating the user Token...</span>';

                // First parse the Token content
                const parts = USER_TOKEN.split('.');
                if (parts.length !== 3) {
                    resultEl.innerHTML = '<span class="error">❌ Invalid Token format</span>';
                    return;
                }

                const header = JSON.parse(atob(parts[0]));
                const payload = JSON.parse(atob(parts[1]));

                resultEl.innerHTML = `<span class="info">📋 Token contents:</span>
<span class="info">Header:</span> ${JSON.stringify(header, null, 2)}
<span class="info">Payload:</span> ${JSON.stringify(payload, null, 2)}

<span class="info">⏳ Validating Token...</span>`;

                const response = await fetch(`${API_BASE}/auth/debug/validate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `token=${encodeURIComponent(USER_TOKEN)}`,
                });

                const data = await response.json();

                resultEl.innerHTML += `

<span class="info">📤 Validation response:</span>
${JSON.stringify(data, null, 2)}`;

                if (data.valid) {
                    resultEl.innerHTML += `

<span class="success">✅ Token validated successfully!</span>`;
                } else {
                    resultEl.innerHTML += `

<span class="error">❌ Token validation failed</span>`;
                }
            } catch (error) {
                resultEl.innerHTML = `<span class="error">❌ Request failed: ${error.message}</span>`;
            }
        }

        // Automatically validate the user Token when the page loads
        window.onload = function() {
            console.log('Page loaded, preparing to test the JWT Token');
            document.getElementById('tokenInput').value = USER_TOKEN;
        };
    </script>
</body>
</html>
